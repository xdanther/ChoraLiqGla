name: dev build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip R8 minification (faster build, larger APK)"
        type: boolean
        default: false

# A new push supersedes the run it replaced instead of queueing behind it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Every APK must carry the same signature or the TV refuses to update it.
      # The keystore lives in repository secrets, never in the repository.
      # (GitHub forbids referencing "secrets" inside an if:, so branch here.)
      - name: Write release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret is configured. This APK is signed with an ephemeral debug key, so it cannot update a previously installed build."
            exit 0
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ARGS="assembleRelease --build-cache -x lintVitalRelease"
          if [ "${{ inputs.quick }}" = "true" ]; then
            echo "::notice::Quick build: R8 minification disabled."
            ARGS="$ARGS -PquickRelease"
          fi
          ./gradlew $ARGS

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: chora-release
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
